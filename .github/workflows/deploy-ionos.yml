# Lädt die Stempeluhr per SFTP ins Hauptverzeichnis von boredbreak.net (IONOS Webhosting).
# Es wird nichts auf dem Server gelöscht – /ifkuh/ und alles andere bleibt unangetastet.
# Benötigte Repository-Secrets: SFTP_HOST, SFTP_USER, SFTP_PASSWORD
# Optional (Repository-Variable): SFTP_ROOT = Ordner der Domain auf dem Webspace (Standard: /)
name: Deploy nach IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_ROOT: ${{ vars.SFTP_ROOT || '/' }}
    steps:
      - name: Zugangsdaten prüfen
        id: check
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::SFTP-Secrets fehlen noch – Deploy übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: lftp installieren
        if: steps.check.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen
        if: steps.check.outputs.ok == 'true'
        run: |
          TARGET="${SFTP_ROOT%/}/"
          # Sicherheitscheck: im Ziel muss schon die Stempeluhr liegen, sonst falscher Pfad
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30;
            open --env-password -u \"$SFTP_USER\" sftp://$SFTP_HOST;
            cat \"${TARGET}index.html\"" | grep -q "<title>Stempeluhr</title>" || {
            echo "::error::Keine Stempeluhr unter ${TARGET}index.html gefunden – bitte SFTP_ROOT prüfen."; exit 1; }
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30;
            open --env-password -u \"$SFTP_USER\" sftp://$SFTP_HOST;
            mirror --reverse --verbose --parallel=4 --exclude-glob .git* --exclude .github/ ./ \"$TARGET\""
