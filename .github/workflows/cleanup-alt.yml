# Einmalig: löscht die nicht mehr benötigten Dateien der alten Stempeluhr aus /stempeln/ auf dem Server.
# Nur manuell startbar. Wird nach dem Lauf wieder entfernt.
name: Altdateien entfernen (einmalig)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      TARGET: ${{ vars.STEMPELN_DIR || '/boredbreak-weiche/stempeln' }}
    steps:
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Inhalt vorher
        run: |
          lftp -c "set sftp:auto-confirm yes; open --env-password -u \"$SFTP_USER\" sftp://$SFTP_HOST;
            cat \"${TARGET%/}/index.html\"" | grep -q "<title>Stempeln" || { echo "::error::Falscher Zielordner"; exit 1; }
          lftp -c "set sftp:auto-confirm yes; open --env-password -u \"$SFTP_USER\" sftp://$SFTP_HOST; cls -l \"${TARGET%/}/\""

      - name: Altdateien löschen
        run: |
          lftp -c "set sftp:auto-confirm yes; open --env-password -u \"$SFTP_USER\" sftp://$SFTP_HOST; cd \"${TARGET%/}\";
            rm -f importexport.js; rm -f feiertage.js; rm -f abgleich.js; rm -f auswertung.js; rm -f beispiel-zeiterfassung.csv"

      - name: Inhalt nachher
        run: lftp -c "set sftp:auto-confirm yes; open --env-password -u \"$SFTP_USER\" sftp://$SFTP_HOST; cls -l \"${TARGET%/}/\""
